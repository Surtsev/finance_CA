[project]
name = "finance"
version = "0.1.0"
description = "Finance application which support to control your money. UI via telegram, Python for backend."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "fastapi>=0.123.5",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.44",
    "telethon>=1.42.0",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
